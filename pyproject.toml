[project]
name = "voice-ai-analytics"
version = "0.1.0"
description = "environment manager for the voice ai analytics project"
authors = [
    {name = "Peter"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-core (>=1.11.2,<2.0.0)",
    "dbt-snowflake (>=1.11.1,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "pandas (>=2.3.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.1.0"

